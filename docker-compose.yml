# DeepSeek Harness (dsh) — rootless compose（对齐 OpenClaw 的运行姿势）
#
# 模式：
#   docker compose up -d                    # 默认 = QQBot 模式（腾讯官方插件，出站 WebSocket，无入站端口）
#   docker compose --profile web up -d      # Web UI 模式（可与 QQBot 并存，profile 目录互不干扰）
#
# .env 示例（与 compose 同目录）：
#   APP_PATH=./data
#   IMAGE_TAG=latest
#   CPUS=2
#   MEMORY_LIMIT=4g
#   QQBOT_APPID=你的AppID
#   QQBOT_SECRET=你的AppSecret
#   DEEPSEEK_API_KEY=sk-xxx     # DeepSeek 官网 API Key，注入后默认 provider 直接可用，
#                               # 同时供 ReMe 记忆整理（auto_memory/auto_dream）复用
#   HOST_IP=0.0.0.0            # 仅 web 模式用：宿主侧绑定地址
#   REME_TAG=latest            # ReMe 记忆服务镜像 tag（生产建议锁版本/digest）
#   REME_BIND=127.0.0.1        # ReMe Studio 端口发布地址（无认证服务，勿暴露公网）
#
# 首次使用（QQBot）：
#   1. touch ${APP_PATH}/.npmrc ${APP_PATH}/.gitconfig   # 单文件挂载要求宿主文件先存在
#   2. docker network create Bot   # 外部网络，本文件全部服务共用（已存在则跳过）
#   3. docker compose up -d
#      （qqbot profile 不存在时 entrypoint 自动安装 @tencent-connect/dsh-qqbot
#        与 @agentscope-ai/reme-dsh-plugin 记忆插件（REME_PLUGIN_INSTALL=0 可关），
#        首启多等 1-2 分钟；日志出现 "Plugin installed." / "ReMe plugin installed." 即完成）
# Linux 宿主注意：${APP_PATH} 各目录需 chown 1000:1000（rootless 写入）；
# 首启会从镜像内备份解包 102MB 到 npm-global 卷，日志停在 initializing 数分钟属正常。

services:
  dsh-qqbot:
    image: deepseek-harness:${IMAGE_TAG:-latest}
    container_name: DeepSeekHarness-QQBot
    hostname: DeepSeekHarness
    user: 1000:1000
    cpuset: "6-7"
    deploy:
      resources:
        limits:
          cpus: ${CPUS:-2}
          memory: ${MEMORY_LIMIT:-4g}
    command: ["qqbot"]
    environment:
      TZ: Asia/Shanghai
      HOME: /home/node
      QQBOT_APPID: ${QQBOT_APPID}
      QQBOT_SECRET: ${QQBOT_SECRET}
      # DeepSeek 官方 provider 的凭据回退变量（存储凭据 .credentials.yaml 优先于它）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # 锁插件版本（默认装 @tencent-connect/dsh-qqbot@latest）：
      # QQBOT_PLUGIN: "@tencent-connect/dsh-qqbot@0.5.5"
      # dsh plugin 安装/更新插件走 npm；npmmirror 同步延迟时移除本项回官方源
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com/
      # ReMe 记忆插件 endpoint 的部署层默认值（容器名直连；qqbot 无状态页，无浏览器
      # 可达性约束。优先级：profile patch 显式配置 > 本环境变量 > 127.0.0.1 默认）
      REME_URL: http://DeepSeekHarness-ReMe:2333
    volumes:
      - ${APP_PATH:-./data}/.npmrc:/home/node/.npmrc
      - ${APP_PATH:-./data}/.gitconfig:/home/node/.gitconfig
      # npm global 目录（含 dsh 安装本体），升级与插件持久化
      - ${APP_PATH:-./data}/npm-global:/home/node/.npm-global
      # harness 主目录：profiles、插件、会话、设置
      - ${APP_PATH:-./data}/dsh:/home/node/.dsh
      # 共享 agent 配置根：AGENTS.md、skills/
      - ${APP_PATH:-./data}/agents:/home/node/.agents
      # agent 工作区
      - ${APP_PATH:-./data}/workspace:/home/node/workspace
    # QQBot 为出站长连接，无需入站端口
    restart: unless-stopped
    networks:
      - Bot
    extra_hosts:
      - search.cloud.20771024.xyz:192.168.31.6   # 按需修改/删除

  # ReMe 记忆服务：daily/digest Markdown 记忆引擎（HTTP 无认证，只挂 Bot 内部网络 +
  # loopback 发布端口；记忆整理 LLM 复用 DEEPSEEK_API_KEY）
  reme:
    image: ghcr.io/agentscope-ai/reme:${REME_TAG:-latest}
    container_name: DeepSeekHarness-ReMe
    user: "1000:1000"
    # 记忆整理调度交给 dsh 插件（qqbot profile 的 autoDreamEnabled，每日 23:00；
    # 多宿主共享 ReMe 时只允许一个调度方）
    command: ["start", "jobs.dream_cron.enabled=false"]
    environment:
      TZ: Asia/Shanghai
      REME_HOST: 0.0.0.0
      REME_PORT: "2333"
      REME_WORKSPACE_DIR: /data
      REME_TIMEZONE: Asia/Shanghai
      # auto_memory / auto_dream 必需的 LLM 凭据（OpenAI 兼容端点）
      LLM_API_KEY: ${DEEPSEEK_API_KEY}
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL_NAME: deepseek-chat
    volumes:
      - ${APP_PATH:-./data}/reme:/data   # 记忆事实源（daily/、digest/），独立卷
    ports:
      - "${REME_BIND:-127.0.0.1}:2333:2333"   # ReMe Studio 浏览入口；无认证服务，勿暴露公网
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    restart: unless-stopped
    networks:
      - Bot

  dsh-web:
    profiles: ["web"]
    image: deepseek-harness:${IMAGE_TAG:-latest}
    container_name: DeepSeekHarness-Web
    hostname: DeepSeekHarness
    user: 1000:1000
    cpuset: "6-7"
    deploy:
      resources:
        limits:
          cpus: ${CPUS:-2}
          memory: ${MEMORY_LIMIT:-4g}
    environment:
      TZ: Asia/Shanghai
      HOME: /home/node
      # DeepSeek 官方 provider 的凭据回退变量（存储凭据 .credentials.yaml 优先于它）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # 用局域网 IP/域名访问 Web UI 时追加信任围栏（localhost 默认放行）：
      # DSH_WEB_EXTRA_ARGS: "--trusted-host 192.168.1.10:3080"
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com/
    volumes:
      - ${APP_PATH:-./data}/.npmrc:/home/node/.npmrc
      - ${APP_PATH:-./data}/.gitconfig:/home/node/.gitconfig
      - ${APP_PATH:-./data}/npm-global:/home/node/.npm-global
      - ${APP_PATH:-./data}/dsh:/home/node/.dsh
      - ${APP_PATH:-./data}/agents:/home/node/.agents
      - ${APP_PATH:-./data}/workspace:/home/node/workspace
    ports:
      - ${HOST_IP:-127.0.0.1}:3080:3080
    restart: unless-stopped
    networks:
      - Bot
    extra_hosts:
      - search.cloud.20771024.xyz:192.168.31.6

networks:
  Bot:
    external: true   # 先 docker network create Bot（网络名区分大小写）；dsh 容器与 ReMe 同网互达
